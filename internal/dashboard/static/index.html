<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>turtle-agent live dashboard</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1>Commanders</h1>
  <select id="route" aria-label="Page: the live runs, or the plan view of a plan"><option value="">Runs (live)</option></select>
  <span id="summary" class="muted"></span>
  <span class="spacer"></span>
  <span id="updated" class="muted"></span>
  <div class="seg" role="group" aria-label="View">
    <button id="v-grid" type="button">Grid</button>
    <button id="v-tabs" type="button">Tabs</button>
  </div>
</header>
<nav id="tabs" hidden></nav>
<main id="cards"><p class="muted" id="empty">Looking for agents...</p></main>
<footer class="muted" id="foot">Read-only: this page only reads the agents' status and the plan files. It never sends a command.</footer>
<script src="view.js"></script>
<script src="text.js"></script>
<script src="layers.js"></script>
<script src="paths.js"></script>
<script src="pathdraw.js"></script>
<script src="unitinfo.js"></script>
<script src="planview.js"></script>
<script src="routeedit.js"></script>
<script src="routeeditui.js"></script>
<script src="app.js"></script>
</body>
</html>
