name: fuzz

# Nightly fuzz of the SMSG parsers (make fuzz). A crash is a failing job; the new corpus file under
# <package>/testdata/fuzz/<target>/ is uploaded as an artifact so it can be committed with the fix as a regression seed
# (the Makefile's fuzz target). `make test` runs only the seeds, so this job is the one that explores new inputs.
on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      # 5 s per target in `make test`; here 2 minutes per target, and a crash stops the run at that target.
      - name: make fuzz
        run: make GOROOT_LOCAL="$(go env GOROOT)" fuzz FUZZTIME=2m

      - name: collect the new fuzz corpus
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fuzz-corpus"
          git status --porcelain | sed -n 's/^?? //p' | grep '/testdata/fuzz/' > "$RUNNER_TEMP/fuzz-files" || true
          while IFS= read -r f; do
            mkdir -p "$RUNNER_TEMP/fuzz-corpus/$(dirname "$f")"
            cp "$f" "$RUNNER_TEMP/fuzz-corpus/$f"
          done < "$RUNNER_TEMP/fuzz-files"

      - name: upload the new fuzz corpus
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: ${{ runner.temp }}/fuzz-corpus
          if-no-files-found: ignore
          retention-days: 14
