name: test

# Gate for dev and main: every PR (to dev, main or a stacked feature branch) and every push runs the
# job `test`; branch protection on dev and main requires it.
on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Draft PRs are work in progress; CI runs when the PR is marked ready.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The Go version comes from go.mod. The repo has no dependencies and so no go.sum,
      # so the module and build cache is keyed on go.mod instead.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      # The Makefile defaults to a Go under $HOME/.local/go; point it at the runner's Go.
      # fmt-check, vet and `go test -race` need no secrets: the tests use fakes and the
      # committed, scrubbed fixtures.
      - name: gofmt, go vet, no-cgo build, go test -race
        run: make GOROOT_LOCAL="$(go env GOROOT)" fmt-check vet test

      # `make test` builds the navmesh engine through cgo (the runner has g++) and runs the navmesh tests, which
      # skip without mmaps. This builds the real binary with cgo explicitly.
      - name: cgo build
        run: CGO_ENABLED=1 make GOROOT_LOCAL="$(go env GOROOT)" build
